# Nginx config for XMD SAAS — serves both desktop and mobile PWA
# Add this to your server block

server {
    listen 80;
    server_name your-domain.com;

    root /var/www/xmd-saas/dist;
    index index.html;

    # ─── Mobile PWA routes → mobile.html ─────────────────────────
    location /m/ {
        try_files $uri $uri/ /mobile.html;
    }
    location = /m {
        rewrite ^ /m/ permanent;
    }

    # ─── Service Worker — must be served from /m/ scope ──────────
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/m/";
        try_files $uri =404;
    }

    # ─── PWA Manifest ────────────────────────────────────────────
    location = /manifest.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ─── Static assets — cache aggressively ──────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /icons/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # ─── API proxy ───────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Desktop SPA fallback ────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Security headers ────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
