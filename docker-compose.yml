version: '3.8'

# ============================================================
# XMD_SAAS - Docker Compose (chạy chung VPS với project khác)
# Port 80/443 KHÔNG mở — dùng Nginx host reverse proxy
# ============================================================

services:
  # PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: xmd-db
    restart: always
    environment:
      POSTGRES_DB: erp_xe_may_dien
      POSTGRES_USER: xmd_user
      POSTGRES_PASSWORD: ${DB_PASS:-changeme_strong_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend-production/000_full_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend-production/migrations/001_license_system.sql:/docker-entrypoint-initdb.d/02_license.sql
    ports:
      - "127.0.0.1:5433:5432"  # Port 5433 tránh xung đột PostgreSQL host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xmd_user -d erp_xe_may_dien"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - xmd-net

  # Backend API
  api:
    build:
      context: ./backend-production
      dockerfile: Dockerfile
    container_name: xmd-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: erp_xe_may_dien
      DB_USER: xmd_user
      DB_PASSWORD: ${DB_PASS:-changeme_strong_password}
      JWT_SECRET: ${JWT_SECRET:-change_this_to_random_64_chars}
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_DAYS: 7
      MAX_LOGIN_ATTEMPTS: 5
      LOCKOUT_MINUTES: 15
      FRONTEND_URL: ${FRONTEND_URL:-https://erp.ten-mien.vn}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:5050:5000"  # API expose port 5050 trên host
    networks:
      - xmd-net

  # Frontend (Nginx serve static + proxy API)
  web:
    image: nginx:alpine
    container_name: xmd-web
    restart: always
    depends_on:
      - api
    ports:
      - "8080:80"  # Truy cập: http://IP_VPS:8080
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./docker-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/uploads:ro
    networks:
      - xmd-net

volumes:
  pgdata:
  uploads:

networks:
  xmd-net:
    driver: bridge
